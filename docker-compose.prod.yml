# 운영(EC2) 배포용 compose 파일. 개발용 docker-compose.yml과 다른 점:
# - 소스 폴더 마운트와 --reload를 쓰지 않는다 (이미지에 들어 있는 코드로만 실행).
# - dev 패키지를 설치하지 않는다 (Dockerfile 기본값 requirements.txt).
# - DB 비밀번호와 비밀키는 서버의 .env에서만 읽는다.
# - 앱(8000)과 DB(5432) 포트는 외부에 열지 않고, Caddy(80/443)만 연다.
#
# 실행: docker compose -f docker-compose.prod.yml up -d --build
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: chatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 설정하세요}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d chatbot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://chatbot:${POSTGRES_PASSWORD}@postgres:5432/chatbot
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET를 .env에 설정하세요}
      AI_API_KEY: ${AI_API_KEY:?AI_API_KEY를 .env에 설정하세요}
      # Caddy가 보내는 X-Forwarded-Proto(https)를 uvicorn이 믿게 한다.
      # 이게 없으면 url_for()가 http:// 주소를 만들어 CSS/JS가 HTTPS 페이지에서 차단된다.
      # web 포트는 외부에 열지 않으므로 Caddy 컨테이너만 이 헤더를 보낼 수 있다.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      # 예: 13-125-10-20.nip.io (EC2 공인 IP의 점을 하이픈으로 바꾼 주소)
      DOMAIN: ${DOMAIN:?DOMAIN을 .env에 설정하세요}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # 발급받은 인증서를 보관한다. 지우면 재시작할 때마다 다시 발급받게 된다.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
